timezone = "Asia/Shanghai"
schedule = "15 13 * * *"

[database]
sqlite_path = "data/app.db"

[arxiv]
categories = ["cs.AI", "cs.LG", "cs.GL"]
page_size = 100
include_revisions = false
max_pages = 5
overlap_hours = 36
request_delay_seconds = 3.0
max_retries = 3
max_rate_limit_retries = 6
retry_backoff_seconds = 15.0
min_rate_limit_delay_seconds = 60.0

[filtering]
include_keywords = ["time series"]
exclude_keywords = []
ai_target_keywords = ["time series"]

[llm]
provider = "openai"
base_url = "https://api.openai.com/v1"
endpoint = "/responses"
# legacy chat endpoint is also supported:
# endpoint = "/chat/completions"
api_key = ""
classify_model = "doubao-seed-2-0-pro-260215"
summarize_model = "doubao-seed-2-0-pro-260215"
detail_model = "doubao-seed-2-0-pro-260215"
output_language = "Chinese"
reasoning_effort = "high"
detail_reasoning_effort = "high"
timeout_seconds = 120
detail_timeout_seconds = 600

[pdf_enrichment]
enabled = true
download_dir = "data/pdfs"
max_file_size_mb = 40
timeout_seconds = 180
max_retries = 2
retry_backoff_seconds = 10.0
upload_expires_after_hours = 24

[digest]
max_papers = 12
section_strategy = "keyword"
output_dir = "data/digests"
attach_markdown = true

[email]
smtp_host = ""
smtp_port = 587
smtp_username = ""
smtp_password = ""
smtp_use_tls = true
from_name = "Daily arXiv Notify"
from_address = ""
recipients = []

[[subscriptions]]
id = "llm-data-synthesis"
name = "LLM Data Synthesis"
enabled = true

[subscriptions.database]
sqlite_path = "data/llm-data-synthesis/app.db"

[subscriptions.arxiv]
categories = ["cs.AI", "cs.LG", "cs.CL", "cs.SE"]

[subscriptions.filtering]
include_keywords = [
  "Agentic Self-Instruct",
  "agentic self-instruct",
  "agentic self instruct",
  "agent self-instruct",
  "self-instruct",
  "self instruction",
  "instruction generation",
  "instruction tuning data",
  "agent-generated data",
  "agentic data generation",
  "automated data generation",
  "synthetic data",
  "data synthesis",
  "synthetic training data",
  "synthetic evaluation data",
  "LLM-generated data",
  "model-generated data",
  "self-generated data",
  "data generation",
  "data curation",
  "high-quality training data",
  "high-quality evaluation data",
  "data quality",
]
exclude_keywords = []
ai_target_keywords = [
  "Agentic Self-Instruct",
  "agentic self-instruct",
  "agentic self instruct",
  "agent self-instruct",
  "self-instruct",
  "self instruction",
  "instruction generation",
  "instruction tuning data",
  "agent-generated data",
  "agentic data generation",
  "automated data generation",
  "synthetic data",
  "data synthesis",
  "synthetic training data",
  "synthetic evaluation data",
  "LLM-generated data",
  "model-generated data",
  "self-generated data",
  "data generation",
  "data curation",
  "high-quality training data",
  "high-quality evaluation data",
  "data quality",
]

[subscriptions.digest]
max_papers = 12
output_dir = "data/digests/llm-data-synthesis"

[subscriptions.email]
recipients = ["leibudao@gmail.com"]
